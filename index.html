<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Viewport fit cover untuk memastikan area layar penuh tanpa terpotong batas browser -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HOTEL AMASING</title>

  <style>
    /* Reset & Penguncian Viewport Layar HP */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height mengikuti tinggi riil layar HP */
      overflow: hidden; /* Mencegah scroll ganda/scrollbar luar */
      background-color: #080c14; /* Warna latar gelap sesuai tema Zettbos Dark */
      position: fixed; /* Mengunci wrapper agar tidak ikut tertarik saat scroll */
      inset: 0;
    }

    /* Iframe Responsif Penuh */
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      height: 100dvh; /* Pas tepat dengan area pandang aplikasi tanpa terdorong address bar */
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>

  <!-- 
    Atribut allow="camera; microphone; geolocation" wajib disematkan 
    agar fitur ambil foto bukti laci & housekeeping di Google Apps Script tidak diblokir oleh GitHub Pages.
  -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzSNjKtYHkQ31jOphhve48n-6zdSlbHupmwd_m_9eBFL0AqVPU1ouZitJ4MTIMQhfrMKw/exec"
    allow="camera; microphone; geolocation"
    allowfullscreen>
  </iframe>

</body>
</html>
